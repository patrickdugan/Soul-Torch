name: Verify Soul Torch
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run soak -- 10000
      - run: npm run autoplay -- 50
      - run: npm run branch-matrix -- 2
      - run: npm run smoke-view
      - run: npm run history-matrix -- 1
      - run: npm run charter-matrix -- 2
